spring.application.name=gerenciamentoEstacionamento
server.port=${PORT:8080}

# Configuracao do DataSource via variaveis de ambiente (Oracle FIAP em producao / H2 modo Oracle em ambiente local)
spring.datasource.url=${DB_URL:jdbc:h2:mem:inpark_db;DB_CLOSE_DELAY=-1;MODE=Oracle}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Inicializacao do schema SQL
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# Ordenacao sequencial das tags e operacoes no Swagger UI
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
