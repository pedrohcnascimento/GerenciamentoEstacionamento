spring.application.name=gerenciamentoEstacionamento

# Desabilita a inicializacao automatica do Docker Compose (caso nao haja Docker instalado)
spring.docker.compose.enabled=false

# Configuracao do broker MQTT (exemplo local)
mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=app-local
mqtt.username=
mqtt.password=
mqtt.clean-session=true
mqtt.automatic-reconnect=true
mqtt.keep-alive-interval=60
mqtt.connection-timeout=30
mqtt.default-qos=1

# Configuracao do banco de dados (H2 em modo MySQL por padrao para execucao local sem necessidade de MySQL instalado;
# pode ser sobrescrito via variaveis de ambiente para MySQL externo)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:inpark_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Console H2 (acessivel em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para usar MySQL local, descomente abaixo ou defina as variaveis de ambiente:
# spring.datasource.url=jdbc:mysql://localhost:3306/inpark_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=senaisp
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

# Execucao do schema.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
